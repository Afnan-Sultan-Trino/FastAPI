<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🥗 Nutrition API - Frontend Test</title>
    <link rel="stylesheet" href="style.css">

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="card">
    <h2>🥗 পুষ্টি ডেটা পাঠান</h2>

    <label>আপনার নাম</label>
    <input type="text" id="name" placeholder="ex: রাফসান">

    <label>বয়স (বছর)</label>
    <input type="number" id="age" placeholder="ex: ২২">

    <label>লিঙ্গ</label>
    <select id="gender">
        <option value="male">পুরুষ</option>
        <option value="female">নারী</option>
    </select>

    <label>ওজন (কেজি)</label>
    <input type="number" step="0.1" id="weight" placeholder="ex: ৬৫.৫">

    <label>উচ্চতা (সেমি)</label>
    <input type="number" step="0.1" id="height" placeholder="ex: ১৭০">

    <label>সপ্তাহে কতদিন এই খাবারগুলো খান?</label>
    <div id="food-frequency-list"></div>

    <button onclick="sendData()">🔍 Analyze</button>

    <div id="result"></div>
</div>

<script src="script.js"></script>

</body>
</html>
